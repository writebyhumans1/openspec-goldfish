name: Publish npm
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Prepare version and push main and tag atomically
        id: release
        run: node scripts/prepare-release.mjs
  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check-release.mjs "$RELEASE_TAG"
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      - run: npm test
      - run: npm run check
      - run: npm pack --dry-run
  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - run: node scripts/check-release.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      - name: Publish or verify this exact release
        run: node scripts/publish-release.mjs
      - name: Create GitHub release after npm succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG"; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
